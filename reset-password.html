<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" type="image/png" href="assets/favicon/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="reset-password.js"></script>
</head>
<body class="admin-body">
<header class="admin-header">
  <!-- <a class="brand" href="index.html"><span class="brand-mark">✉</span><span>DE MAILER<small>THA POSTMAN'S OFFICE</small></span></a> -->

  <a class="brand" href="#home" aria-label="De Mailer home">
  <span class="brand-mark">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="5" y="10" width="38" height="28" rx="5"
        stroke="currentColor" stroke-width="2.8"/>
      <path d="M7 14L24 27L41 14"
        stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 36L19 25M41 36L29 25"
        stroke="currentColor" stroke-width="2.8"
        stroke-linecap="round"/>
    </svg>
  </span>
  <span>
    DE MAILER
    <small>THE POST OFFICE</small>
  </span>
</a>
  <a href="index.html" class="text-link">← Back to website</a>
</header>

<main class="admin-wrap">

  <div class="admin-title">
    <span class="eyebrow">ACCOUNT SECURITY</span>
    <h1>Reset Password<span class="purple-dot">.</span></h1>
    <p>Create a new password for your administrator account.</p>
  </div>

  <section class="admin-panel">

    <form id="resetPasswordForm" class="reset-form">

      <label>
        New password
        <input
          type="password"
          id="newPassword"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter your new password"
          required
        >
      </label>

      <label>
        Confirm new password
        <input
          type="password"
          id="confirmPassword"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter your password again"
          required
        >
      </label>

      <button
        type="submit"
        class="button button-purple button-full"
        id="resetButton"
      >
        Update password
      </button>

      <p class="form-feedback" id="resetFeedback" aria-live="polite">
        Verifying your recovery link...
      </p>

    </form>

  </section>

</main>

</body>
</html>
